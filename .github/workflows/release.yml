name: Release

# 打 tag 时自动出包、签名并发布到 GitHub Release 与腾讯云 COS。
#
# **触发条件**：`v*` 形式的 tag 推送。
# 手动触发（workflow_dispatch）用于重跑失败的构建。
#
# ## 更新通道的两层信任
#
# 1. **minisign 数字签名**（`TAURI_SIGNING_PRIVATE_KEY`）
#    安装包由私钥签名，客户端用内置公钥验签——**验签不过就不安装**。
#    私钥只存在于 GitHub Secrets，不进任何分发渠道。
#    详见《发布与防投毒》第二节「第 4 层：分发信任」。
#
# 2. **SHA256SUMS.txt**
#    供用户手工核对，与签名是两条独立的验证路径。
#
# ## 需要的 Secrets
#
# - `TAURI_SIGNING_PRIVATE_KEY`：minisign 私钥（**必填**，缺了构建不出签名产物）
# - `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`：私钥密码（留空则不设密码）
# - `TENCENT_SECRET_ID` / `TENCENT_SECRET_KEY`：腾讯云 COS 凭据（**可选**，
#   没配就跳过 COS 上传，只发 GitHub Release——客户端会自动回落到 GitHub 端点）

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.2.0）"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "3"

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # 发布需要完整历史来生成版本号
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # ---------------- 门禁 ----------------
      # 发布出去的产物必须是「过了全部检查」的产物。
      # 这里不复用 CI 的结果，而是**在同一次构建里再跑一遍**——
      # tag 可能是在 CI 通过之后才推的，中间可能又合进了别的提交。

      - name: Rust 格式检查
        run: cargo fmt --all -- --check

      - name: Rust 静态检查
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust 单元测试
        run: cargo test --workspace

      - name: 发布前安全自检
        run: pnpm check:security

      - name: 前端类型检查
        run: pnpm typecheck

      - name: 前端静态检查
        run: pnpm lint

      - name: 前端单元测试
        run: pnpm test

      # ---------------- 出包 ----------------

      - name: 准备签名私钥
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "缺少 Secret: TAURI_SIGNING_PRIVATE_KEY——没有私钥就生成不了签名产物，客户端不会安装"
          }
          # 私钥写成文件：Tauri 的构建脚本要把它当路径用，
          # 内容直接塞进环境变量在多行时容易出问题。
          $keyPath = Join-Path $env:RUNNER_TEMP "tauri-signing.key"
          [System.IO.File]::WriteAllText($keyPath, $env:TAURI_SIGNING_PRIVATE_KEY)
          "TAURI_SIGNING_PRIVATE_KEY_PATH=$keyPath" >> $env:GITHUB_ENV
          # 密码为空表示私钥未设密码
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> $env:GITHUB_ENV

      - name: 构建正式包（含签名）
        run: pnpm build
        env:
          # 抑制 Windows 上 NSIS 打包时的控制台噪音
          CI: "true"
          # 签名私钥：路径形式，避开环境变量内容里的换行问题
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PATH }}

      - name: 校验签名产物存在
        shell: pwsh
        run: |
          $bundle = "apps/desktop/src-tauri/target/release/bundle"
          $sig = Get-ChildItem -Path $bundle -Recurse -Filter "*.sig" -ErrorAction SilentlyContinue
          if (-not $sig) {
            throw "没有生成任何 .sig 签名文件——检查 TAURI_SIGNING_PRIVATE_KEY 是否正确"
          }
          Write-Host "签名产物："
          $sig | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: 生成校验和清单
        run: node scripts/gen-checksums.mjs

      - name: 自检清单与产物一致
        run: node scripts/gen-checksums.mjs --verify

      # 两份清单内容相同（版本、签名一致），只有下载地址不同：
      # COS 那份指向 COS，GitHub 那份指向 GitHub Release。
      # 分开放是为了让两个端点的「清单 → 下载地址」始终自洽——
      # 从 COS 拿到的清单会指向 COS，从 GitHub 拿到的指向 GitHub。
      - name: 生成更新清单（腾讯云 COS）
        run: node scripts/gen-updater-manifest.mjs --base-url https://sereno-updates-1316381240.cos.ap-beijing.myqcloud.com --out .release/cos/latest.json

      - name: 生成更新清单（GitHub Release）
        run: node scripts/gen-updater-manifest.mjs --base-url "https://github.com/zuoqiuning/Sereno/releases/download/${{ inputs.tag || github.ref_name }}" --out .release/github/latest.json

      # ---------------- 发布到 GitHub Release ----------------

      - name: 解析版本号
        id: version
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          if (-not $tag.StartsWith("v")) {
            throw "tag 必须以 v 开头，例如 v0.2.0（实际：$tag）"
          }
          $version = $tag.TrimStart("v")
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne $version) {
            throw "tag 版本 ($version) 与 package.json 版本 ($($pkg.version)) 不一致，请先执行 pnpm version:set"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: 上传产物到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Sereno ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          # GitHub 端点的 URL 固定是 `latest.json`，而我们要发布的这份
          # 清单里写的是 GitHub 的下载地址（COS 那份指向 COS）。
          # 两者内容不同，所以用 `asset_name` 改资产名。
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi.sig
            apps/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt
            .release/github/latest.json
          fail_on_unmatched_files: false

      - name: 校验 Release 资产完整性
        shell: pwsh
        run: |
          $release = gh release view "${{ steps.version.outputs.tag }}" --json assets | ConvertFrom-Json
          $names = $release.assets | ForEach-Object { $_.name }
          Write-Host "Release 资产："
          $names | ForEach-Object { Write-Host "  $_" }

          if (-not ($names | Where-Object { $_ -eq "SHA256SUMS.txt" })) {
            throw "缺少 SHA256SUMS.txt——用户将无法手工核对"
          }
          if (-not ($names | Where-Object { $_ -eq "latest.json" })) {
            throw "缺少 latest.json——客户端的更新端点会 404"
          }
          $installers = $names | Where-Object { $_ -match "-setup\.exe$" -or $_ -match "\.msi$" }
          if (-not $installers) {
            throw "没有找到任何安装包"
          }
          $signatures = $names | Where-Object { $_ -match "\.sig$" }
          if (-not $signatures) {
            throw "缺少 .sig 签名文件——客户端会拒绝安装"
          }
          Write-Host "OK：清单、签名与安装包都已发布"

      # ---------------- 发布到腾讯云 COS ----------------
      #
      # COS 是国内用户的首选下载源（GitHub 直连很慢）。
      # 没配凭据就跳过——客户端的第二个端点指向 GitHub Release，功能不受影响。

      - name: 上传到腾讯云 COS
        if: ${{ secrets.TENCENT_SECRET_ID != '' }}
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TENCENT_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          AWS_DEFAULT_REGION: ap-beijing
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = "apps/desktop/src-tauri/target/release/bundle"
          $endpoint = "https://cos.ap-beijing.myqcloud.com"
          $bucket = "s3://sereno-updates-1316381240"

          # latest.json 必须 no-cache：
          # CDN 缓存了旧的清单，用户就永远收不到更新。
          # 这是发布更新时最常见的坑。
          aws s3 cp ".release/cos/latest.json" "$bucket/latest.json" `
            --endpoint-url $endpoint `
            --content-type "application/json" `
            --cache-control "no-cache, no-store, must-revalidate" `
            --acl "public-read"

          # 安装包与签名：内容不可变，可以长期缓存
          Get-ChildItem -Path $bundle -Recurse -Include "*.exe", "*.msi", "*.sig" | ForEach-Object {
            aws s3 cp $_.FullName "$bucket/$($_.Name)" `
              --endpoint-url $endpoint `
              --cache-control "public, max-age=31536000, immutable" `
              --acl "public-read"
          }

          Write-Host "COS 上传完成"
          aws s3 ls "$bucket/" --endpoint-url $endpoint

      - name: 验证 COS 上的清单可访问
        if: ${{ secrets.TENCENT_SECRET_ID != '' }}
        shell: pwsh
        run: |
          $url = "https://sereno-updates-1316381240.cos.ap-beijing.myqcloud.com/latest.json"
          $response = Invoke-WebRequest -Uri $url -UseBasicParsing
          if ($response.StatusCode -ne 200) {
            throw "COS 上的 latest.json 不可访问（HTTP $($response.StatusCode)）"
          }
          $json = $response.Content | ConvertFrom-Json
          Write-Host "COS 清单版本：$($json.version)"
          Write-Host "下载地址：$($json.platforms.'windows-x86_64'.url)"
