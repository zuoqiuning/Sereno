name: Release

# 打 tag 时自动出包并发布 GitHub Release。
#
# **触发条件**：`v*` 形式的 tag 推送。
# 手动触发（workflow_dispatch）用于重跑失败的构建。
#
# ## 为什么必须有 SHA256SUMS.txt
#
# 客户端的更新通道（`core/version/update.rs`）**不依赖代码签名**，
# 而是下载安装包后与随包发布的 SHA256SUMS.txt 逐字节核对。
# 因此这个文件不是可选附件——**没有它客户端会拒绝安装**。
# 详见《发布与防投毒》第二节「第 4 层：分发信任」。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.2.0）"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "3"

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # 发布需要完整历史来生成版本号
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # ---------------- 门禁 ----------------
      # 发布出去的产物必须是「过了全部检查」的产物。
      # 这里不复用 CI 的结果，而是**在同一次构建里再跑一遍**——
      # tag 可能是在 CI 通过之后才推的，中间可能又合进了别的提交。

      - name: Rust 格式检查
        run: cargo fmt --all -- --check

      - name: Rust 静态检查
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust 单元测试
        run: cargo test --workspace

      - name: 发布前安全自检
        run: pnpm check:security

      - name: 前端类型检查
        run: pnpm typecheck

      - name: 前端静态检查
        run: pnpm lint

      - name: 前端单元测试
        run: pnpm test

      # ---------------- 出包 ----------------

      - name: 构建正式包
        run: pnpm build
        env:
          # 抑制 Windows 上 NSIS 打包时的控制台噪音
          CI: "true"

      - name: 生成校验和清单
        run: node scripts/gen-checksums.mjs

      - name: 自检清单与产物一致
        run: node scripts/gen-checksums.mjs --verify

      # ---------------- 发布 ----------------

      - name: 解析版本号
        id: version
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          if (-not $tag.StartsWith("v")) {
            throw "tag 必须以 v 开头，例如 v0.2.0（实际：$tag）"
          }
          $version = $tag.TrimStart("v")
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne $version) {
            throw "tag 版本 ($version) 与 package.json 版本 ($($pkg.version)) 不一致，请先执行 pnpm version:set"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: 上传产物到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Sereno ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: 校验 Release 资产完整性
        shell: pwsh
        run: |
          # 客户端会拒绝「清单里没有自己」的安装包，
          # 因此这里在发布后立刻核对一遍资产与清单是否对得上。
          $release = gh release view "${{ steps.version.outputs.tag }}" --json assets | ConvertFrom-Json
          $names = $release.assets | ForEach-Object { $_.name }
          Write-Host "Release 资产："
          $names | ForEach-Object { Write-Host "  $_" }

          if (-not ($names | Where-Object { $_ -eq "SHA256SUMS.txt" })) {
            throw "缺少 SHA256SUMS.txt——客户端会拒绝安装"
          }
          $installers = $names | Where-Object { $_ -match "-setup\.exe$" -or $_ -match "\.msi$" }
          if (-not $installers) {
            throw "没有找到任何安装包"
          }
          Write-Host "OK：清单与安装包都已发布"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
