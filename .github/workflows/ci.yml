name: CI

# 提交前必须跑通的门禁（见《测试策略与回归清单》）：
#   cargo fmt --check / cargo clippy -D warnings / cargo test / pnpm typecheck + lint
#
# 单人项目靠自觉一定会漏，尤其是 `clippy -D warnings` 与 `pnpm typecheck`
# —— 这两条不跑，`bindings.ts` 与调用点漂移时构建依然会成功。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送自动取消上一次未跑完的 CI，省额度也省等待
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 默认权限最小化：CI 只需要读代码
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # cargo 挂在 registry 下载上会既不报错也不动，这里设超时兜底
  CARGO_HTTP_TIMEOUT: "30"
  CARGO_HTTP_LOW_SPEED_LIMIT: "1"
  CARGO_NET_RETRY: "3"

jobs:
  check:
    # Tauri 是 Windows 优先的项目，MSVC 工具链与 WebView2 在 Windows runner 上最省事
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # ----------------------------------------------------------------
      # 顺序很重要：pnpm 必须排在 setup-node 之前
      #
      # setup-node 的 `cache: 'pnpm'` 会调用 `pnpm store path` 来定位缓存目录。
      # 如果那时 pnpm 还没装好，runner 会直接报
      #   Unable to locate executable file: pnpm
      # 并中断整个流程。反过来，setup-node 读 package.json 的 packageManager
      # 字段自动装 pnpm 时，同样依赖 pnpm 已经可用——所以先装 pnpm 最稳。
      #
      # 版本不在这里写死：pnpm/action-setup 会读 package.json 的
      # `packageManager` 字段（当前 pnpm@12.15.0），保证 CI 与本地永远一致。
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # rust-toolchain.toml 里已固定版本与组件，rustup 会自动安装
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # ---------------- Rust ----------------
      - name: Rust 格式检查
        run: cargo fmt --all -- --check

      - name: Rust 静态检查
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust 单元测试
        run: cargo test --workspace

      # ---------------- 安全自检 ----------------
      # 授权声明、注入面、Tauri 权限、CSP、构建加固、产物洁净度
      - name: 发布前安全自检
        run: pnpm check:security

      # ---------------- 前端 ----------------
      - name: 前端类型检查
        run: pnpm typecheck

      - name: 前端静态检查
        run: pnpm lint

      - name: 前端单元测试
        run: pnpm test

      - name: 前端构建
        run: pnpm build:web
