[package]
name = "sereno-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sereno — 极简纯净的 Minecraft 第三方启动器"
authors = ["丘屿知宁"]
publish = false

[lib]
# Tauri 2 要求桌面层以 lib 形式提供，main.rs 只做转发
name = "sereno_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
serde_json = "1"

[dependencies]
# ---- Tauri 壳 ----
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"

# ---- 类型生成：三个版本号必须带 = 且 RC 号一致 ----
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"

# ---- 领域层 ----
sereno-core = { path = "../../../crates/sereno-core" }

# ---- 通用 ----
opener = { version = "0.7.2", features = ["reveal"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
regex = "1.13.1"
tracing = { workspace = true }

# ---- 日志：subscriber 做输出控制；文件 sink 由 logging.rs 自管（按天 + 50 MB 分段） ----
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "ansi"] }

# ---- 环境变量：从 .env 读 CurseForge API Key 等，不写入设置文件 ----
dotenvy = "0.15.7"

[features]
# 默认关闭 devtools，避免 release 误开
custom-protocol = ["tauri/custom-protocol"]

# profile 一律定义在 workspace 根 Cargo.toml，子包内定义会被忽略