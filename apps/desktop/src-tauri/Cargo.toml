[package]
name = "sereno-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sereno — 极简纯净的 Minecraft 第三方启动器"
authors = ["丘屿知宁"]
publish = false

[lib]
# Tauri 2 要求桌面层以 lib 形式提供，main.rs 只做转发
name = "sereno_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
serde_json = "1"

[dependencies]
# ---- Tauri 壳 ----
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"

# ---- 更新通道 ----
# updater：minisign 签名校验的官方更新插件（公钥写进 tauri.conf.json）
#
# **不引 tauri-plugin-process**：重启应用用 Tauri 核心的
# `AppHandle::request_restart()` 即可，少一个插件就少一份权限面。
tauri-plugin-updater = "2.13.3"

# ---- 类型生成：三个版本号必须带 = 且 RC 号一致 ----
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"

# ---- 领域层 ----
sereno-core = { path = "../../../crates/sereno-core" }

# ---- 通用 ----
opener = { version = "0.7.2", features = ["reveal"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
regex = "1.13.1"
tracing = { workspace = true }

# ---- 日志：subscriber 做输出控制；文件 sink 由 logging.rs 自管（按天 + 50 MB 分段） ----
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "ansi"] }

# ---- 环境变量：从 .env 读微软登录的客户端 ID 等，不写入设置文件 ----
dotenvy = "0.15.7"

[features]
# 默认关闭 devtools，避免 release 误开
custom-protocol = ["tauri/custom-protocol"]

# profile 一律定义在 workspace 根 Cargo.toml，子包内定义会被忽略
[dev-dependencies]
# 只用于测试：模拟 tauri-plugin-updater 用 `log` crate 打的日志。
# `tracing-log` 提供 `LogTracer`——生产环境里由 Tauri 安装，
# 测试里要自己装，否则 `log` 的事件会被静默丢弃。
log = "0.4"
tracing-log = "0.2"
