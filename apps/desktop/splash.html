<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sereno</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: transparent;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }

      .logo {
        width: 180px;
        height: 180px;
      }

      /* 尊重减少动态效果偏好：只保留静态图标 */
      @media (prefers-reduced-motion: reduce) {
        .shine {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <svg class="logo" viewBox="0 0 100 100" role="img" aria-label="Sereno">
      <defs>
        <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity="0" />
          <stop offset="0.5" stop-color="#fff" stop-opacity="0.55" />
          <stop offset="1" stop-color="#fff" stop-opacity="0" />
        </linearGradient>

        <mask id="cut65" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
          <rect width="100" height="100" fill="#fff" />
          <rect x="36" y="45.5" width="28" height="5" fill="#000" transform="rotate(65 50 48)" />
        </mask>

        <mask id="logoMask" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
          <rect width="100" height="100" fill="#000" />
          <path
            d="M 72 24 L 38 24 A 12 12 0 0 0 38 48 L 62 48 A 12 12 0 0 1 62 72 L 28 72"
            fill="none"
            stroke="#fff"
            stroke-width="14"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <rect x="36" y="45.5" width="28" height="5" fill="#000" transform="rotate(65 50 48)" />
        </mask>
      </defs>

      <path
        d="M 72 24 L 38 24 A 12 12 0 0 0 38 48 L 62 48 A 12 12 0 0 1 62 72 L 28 72"
        fill="none"
        stroke="#0F64B5"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"
        mask="url(#cut65)"
      />

      <!-- 扫光：只沿图标笔画扫过，不额外做漂浮、光环或文字 -->
      <g mask="url(#logoMask)">
        <rect class="shine" x="-30" y="0" width="30" height="100" fill="url(#shine)">
          <animateTransform
            attributeName="transform"
            type="translate"
            values="-30 0; 130 0; 130 0"
            keyTimes="0; 0.45; 1"
            dur="1.8s"
            repeatCount="indefinite"
            calcMode="spline"
            keySplines="0.4 0 0.2 1; 0 0 1 0"
          />
        </rect>
      </g>
    </svg>
  </body>
</html>
